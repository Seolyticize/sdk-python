name: Publish
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Version
        id: version
        run: echo "version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"
      - name: Tag matches pyproject.toml
        if: github.ref_type == 'tag'
        run: test "v${{ steps.version.outputs.version }}" = "$GITHUB_REF_NAME"
      - name: Already on PyPI?
        id: pypi
        run: |
          if curl -sf "https://pypi.org/pypi/seolyticize/${{ steps.version.outputs.version }}/json" >/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.pypi.outputs.published != 'true'
        run: uv build
      - if: steps.pypi.outputs.published != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          attestations: true
